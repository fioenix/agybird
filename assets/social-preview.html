<!doctype html>
<!--
  Source for assets/social-preview.png, the GitHub social preview (1280x640).
  Render: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --hide-scrollbars --force-device-scale-factor=1 --window-size=1280,640 \
    --screenshot=assets/social-preview.png "file://$PWD/assets/social-preview.html"
  Upload the PNG under Settings > General > Social preview. Uses system fonts, so
  rendering on another OS shifts the type slightly.
-->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden}
  body{background:#FBF8FD;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#0B0B17;position:relative}
  .accent{position:absolute;left:0;top:0;width:100%;height:12px;background:linear-gradient(90deg,#9750C4 0 70%,#7FE2CE 70% 100%)}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 96px;gap:72px}
  .mark{flex:0 0 300px;height:300px;border-radius:64px;background:#fff;box-shadow:0 1px 0 #E9E2F1,0 18px 48px rgba(151,80,196,.14);display:flex;align-items:center;justify-content:center}
  .mark svg{width:236px;height:236px}
  h1{margin:0;font-size:112px;font-weight:700;letter-spacing:-4px;line-height:1}
  .tag{margin:22px 0 0;font-size:40px;line-height:1.25;color:#3D3D58;font-weight:500;max-width:680px}
  .meta{position:absolute;left:96px;right:96px;bottom:56px;display:flex;justify-content:space-between;font-size:24px;color:#6B6B88}
  .meta b{color:#9750C4;font-weight:600}
</style></head><body>
<div class="accent"></div>
<div class="wrap">
  <div class="mark"><svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
    <circle cx="49" cy="76" r="22" fill="none" stroke="#9750C4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M71 98 V54 Q71 30 91 30 Q99 30 103 36 L115 44 L101 50" fill="none" stroke="#9750C4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27 70 L13 60" fill="none" stroke="#9750C4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="87" cy="44" r="5" fill="#9750C4"/></svg></div>
  <div>
    <h1>Agybird</h1>
    <p class="tag">Delegate work to the Antigravity CLI you already use.</p>
  </div>
</div>
<div class="meta"><span><b>Claude Code</b> &amp; <b>Codex</b> plugin · MIT · Unofficial</span><span>github.com/fioenix/agybird</span></div>
</body></html>
